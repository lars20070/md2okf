---
schemaVersion: "2"
kind: sandbox
name: pi
displayName: Pi kit
description: >
  Runs the Pi terminal coding agent in a Docker Sandbox microVM, configured for
  OpenRouter and proxy-managed API credentials.

sandbox:
  # Docker's own Pi image (docker/sbx-kits-contrib, pi/Dockerfile), reused as
  # a plain image. This is not `extends:` — that accepts only claude, codex,
  # copilot, cursor, gemini, kiro and opencode — and nothing of that repo's Pi
  # kit spec comes along: none of its credentials, allowlist or setup. The
  # image is the shell-docker template plus Pi, installed with
  # `npm install -g` as the agent user, `fd-find` with an `fd` link, and the
  # `pi` flavor label that `sbx ls` reports. Its NPM_CONFIG_PREFIX
  # (/usr/local/share/npm-global) is owned by the agent user, so the user-1000
  # `npm install --global` steps below keep working.
  #
  # The tag is rebuilt nightly against Pi's npm `latest`, so it is pinned by
  # its index digest instead. That freezes Pi, the npm dependency tree it
  # resolved without a lockfile (Pi stopped shipping one in 1.0.1), and the
  # shell-docker template beneath it, for both architectures at once.
  # Template fixes therefore reach this kit only with a new digest; the
  # README's "Bumping Pi" has the check to run before bumping.
  image: "docker.io/sbx/pi-image@sha256:134b48cfc7b83a270d12d2c0ad0b7b7d0d40ffedf7dd567792246a9215a1d2d5"
  # Model and provider come from the kit's own config (files/home/.pi/agent/
  # settings.json + models.json), delivered to ~/.pi/agent/ in the VM. No
  # --provider/--model flags here — Pi resolves defaults from settings.json.
  entrypoint:
    - sh
    - -c
    - |
      set -eu
      mount_state_status=0
      sh "$HOME/.local/lib/md2okf/mount-state.sh" \
        "$HOME/.pi/agent/sessions" sessions || mount_state_status=$?
      if [ "${mount_state_status}" -ne 0 ]; then
        echo "md2okf: could not relocate Pi sessions onto state; refusing to start pi" >&2
        exit "${mount_state_status}"
      fi
      # The `github` MCP server in ~/.pi/agent/mcp.json reads
      # GITHUB_PERSONAL_ACCESS_TOKEN, which mcp.json sets from
      # "${GITHUB_TOKEN}"; Pi expands that from this process's environment.
      # GH_TOKEN is the proxy-managed `github` sentinel declared under
      # credentials: below. The md2okf-agent shim (files: below) makes the
      # same exports for every process the driver starts with `sbx exec`.
      if [ -n "${GH_TOKEN:-}" ]; then
        export GITHUB_TOKEN="$GH_TOKEN"
        export GITHUB_PERSONAL_ACCESS_TOKEN="$GH_TOKEN"
      fi
      exec pi "$@"
    - md2okf-entrypoint

# The AI profile Pi reads, and the text appended to it.
agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment
    You are Pi running inside a Docker Sandbox microVM. Your workspace is the
    OKF wiki itself, mounted read-write, and edits apply directly to the host
    working tree. Four more host paths are mounted:

    - `../md/` — read-only source documents
    - `../scripts/` — read-only, the projects behind the CLIs listed below
    - `../SPEC.md` — read-only, the OKF specification
    - `$MD2OKF_STATE_DIR/sessions` — writable persistent state for Pi sessions

    Nothing else from the user's project is mounted, so no other file of theirs
    is visible or reachable — not the repository, not its history, not its
    configuration. Pi writes sessions to its native `~/.pi/agent/sessions`
    path, which is bind-mounted onto `$MD2OKF_STATE_DIR/sessions`. A write
    anywhere outside the wiki and state directory either fails or lands in the
    VM's own filesystem and is lost when the sandbox is removed.

    `sudo` is passwordless. If a host is blocked by policy, ask the user to allow
    it with `sbx policy allow network "<host>"`.

    ## Installed tools
    These commands are on PATH. Use them; do not reinstall them.

    - `curl`, `fd` (also on PATH as `fdfind`, Ubuntu's name for it), `jq`,
      `python3`, `rg` (ripgrep), `shellcheck`, `tree`
    - `okfctl` — OKF bundle tool: validate, lint, analyze, and the authoring
      verbs (the curate-okf skill covers it)
    - `markdownlint-cli2`, `cspell` — Markdown and spelling
    - `ruff`, `yamllint` — Python and YAML
    - `inspectmd` — Markdown heading map (line ranges and word counts)
    - `inspectokf` — wiki directory tree (via `tree`)
    - `sizeokf` — Markdown content word counts, excluding frontmatter
    - `merkleokf` — wiki Merkle hash tree, for change detection
    - `mq` — jq-like query/filter tool for Markdown (https://mqlang.org)
    - GitHub: in an interactive session the `github` MCP server is
      configured, but its tools are deferred, so they are not declared until
      you load them. Call `tool_search` with what you need, then call the
      `mcp__github__*` tools it loads. A compile run starts Pi with
      `--no-mcp`, so it has neither those tools nor `tool_search`. `gh`, and
      `git` over HTTPS, carry the sandbox's GitHub credential whenever one is
      bound, in every run, so treat them like any other tool with reach
      beyond the wiki.

# Outbound egress allowlist. Default-deny: every host the kit reaches must be
# listed. Pointing Pi at a different provider means adding its host here too —
# see "Using another provider" in the README.
permissions:
  network:
    allow:
      # Model API. Must match credentials[].apiKey.inject[].domain exactly.
      - "openrouter.ai"
      # Pi service bootstrap.
      - "pi.dev"
      # npm: context7-pi, markdownlint-cli2, cspell. Pi itself comes prebuilt
      # in the base image, so npm no longer installs pi-coding-agent.
      - "registry.npmjs.org:443"
      # uv tool install: ruff, yamllint (index + wheels).
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      # apt-get update refreshes every template source, so all of them must
      # be reachable: Ubuntu amd64 (archive/security), arm64 (ports), and
      # Docker's apt repo (pre-added by shell-docker).
      - "archive.ubuntu.com:80"
      - "security.ubuntu.com:80"
      - "ports.ubuntu.com:80"
      - "download.docker.com:443"
      # GitHub: the GitHub MCP server's API calls and `gh` (api.github.com),
      # git over HTTPS (github.com), and the mq, okfctl and github-mcp-server
      # release binaries: github.com redirects to a GitHub CDN host. Today
      # that is objects.githubusercontent.com; release-assets is also used for
      # release downloads and must stay allowlisted. The `github` credential
      # below is injected for api.github.com and github.com. No gist hosts:
      # Pi's `/share` is not needed here.
      - "api.github.com:443"
      - "github.com:443"
      - "objects.githubusercontent.com:443"
      - "release-assets.githubusercontent.com:443"
      # mq docs and language reference (mqlang.org/book/), for the agent to
      # consult at runtime. Host only: kit rules match hosts, not URL paths.
      - "mqlang.org:443"
      # Context7 docs API (native @upstash/context7-pi extension).
      - "context7.com:443"

# Credentials declare WHAT the kit needs and how the proxy injects it — not
# where it lives on the host (that comes from the user bindings / host env).
# proxyManaged: true sets OPENROUTER_API_KEY inside the container as a
# proxy-managed sentinel (replaces the v1 environment.proxyManaged list).
credentials:
  - service: openrouter
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          header: Authorization
          format: "Bearer %s"
  # Optional, in the same shape as Docker's github-clone mixin
  # (docker/sbx-kits-contrib). GH_TOKEN is the sentinel: a bearer token on
  # api.github.com (gh, github-mcp-server) and x-access-token basic auth on
  # github.com (git over HTTPS). `sbx secret set github` on the host binds it,
  # and only at create time; with nothing bound, SBX_CRED_GITHUB_MODE reads
  # `none` and GitHub stays unauthenticated. A bound token is usable by every
  # process in the sandbox, compile turns included — see the README's
  # "GitHub MCP server" before binding one.
  - service: github
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          header: Authorization
          format: "Bearer %s"
        - domain: github.com
          header: Authorization
          username: x-access-token
          format: "%s"

# Runs once at sandbox create, in order, via `sh -c`. `user` defaults to root
# ("0"); "1000" is the agent.
setup:
  install:
    # Distro CLI tools the agent shells out to. No fd-find here: the base
    # image ships it, with an `fd` link next to Ubuntu's `fdfind`. Pi needs one
    # of the two on PATH, or it downloads an unpinned `fd` from GitHub releases
    # at first launch. ripgrep covers Pi's other bundled tool the same way.
    - command: |
        set -eu
        apt-get update
        apt-get install -y \
          curl \
          jq \
          python3 \
          ripgrep \
          shellcheck \
          tree
      description: Install distro CLI tools

    # npm through the sandbox proxy is flaky on this image. `npm config`
    # writes ~/.npmrc, so every later npm step inherits it — which is why this
    # runs before the first of them, as the same user (1000) that owns that
    # ~/.npmrc. Pi itself is not installed here: it comes with the image.
    - command: |
        set -eu
        npm config set proxy "$HTTP_PROXY"
        npm config set https-proxy "$HTTP_PROXY"
      user: "1000"
      description: Configure npm proxy

    - command: npm install --global markdownlint-cli2@0.23.2 cspell@10.0.1
      user: "1000"
      description: Install Markdown and spelling linters

    - command: |
        set -eu
        uv tool install ruff@0.16.2
        uv tool install yamllint@1.38.0
      user: "1000"
      description: Install Python linters

    # No apt/uv/npm package; fetched as a pinned, checksummed release binary.
    - command: |
        set -eu
        MQ_VERSION=0.8.2

        case "$(uname -m)" in
          x86_64) MQ_TARGET=x86_64-unknown-linux-gnu ;;
          aarch64) MQ_TARGET=aarch64-unknown-linux-gnu ;;
          *)
            echo "mq: unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        tmp=$(mktemp -d)
        base="https://github.com/harehare/mq/releases/download/v${MQ_VERSION}"
        curl -fsSL -o "$tmp/mq" "${base}/mq-${MQ_TARGET}"
        curl -fsSL -o "$tmp/checksums.txt" "${base}/checksums.txt"

        expected=$(awk -v f="mq-${MQ_TARGET}/mq-${MQ_TARGET}" '$2 == f { print $1 }' \
          "$tmp/checksums.txt")
        actual=$(sha256sum "$tmp/mq" | awk '{ print $1 }')
        if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
          echo "mq: checksum mismatch for ${MQ_TARGET}" >&2
          exit 1
        fi

        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$tmp/mq" "$HOME/.local/bin/mq"
        rm -rf "$tmp"
      user: "1000"
      description: Install mq (Markdown query tool)

    # Same story as mq, one release archive rather than a bare binary. The
    # checksums.txt second column is a plain filename here, so the awk match is
    # on the archive name. Only okfctl is extracted: the archive also carries
    # okfctl-search, whose semantic index needs a model download from a host
    # that is not allowlisted.
    - command: |
        set -eu
        OKFCTL_VERSION=0.4.0

        case "$(uname -m)" in
          x86_64) OKFCTL_ARCH=amd64 ;;
          aarch64) OKFCTL_ARCH=arm64 ;;
          *)
            echo "okfctl: unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        tmp=$(mktemp -d)
        archive="okfctl_${OKFCTL_VERSION}_linux_${OKFCTL_ARCH}.tar.gz"
        base="https://github.com/cwest/okfctl/releases/download/v${OKFCTL_VERSION}"
        curl -fsSL -o "$tmp/$archive" "${base}/${archive}"
        curl -fsSL -o "$tmp/checksums.txt" "${base}/checksums.txt"

        expected=$(awk -v f="$archive" '$2 == f { print $1 }' "$tmp/checksums.txt")
        actual=$(sha256sum "$tmp/$archive" | awk '{ print $1 }')
        if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
          echo "okfctl: checksum mismatch for ${archive}" >&2
          exit 1
        fi

        tar -xzf "$tmp/$archive" -C "$tmp" okfctl
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$tmp/okfctl" "$HOME/.local/bin/okfctl"
        rm -rf "$tmp"
      user: "1000"
      description: Install okfctl (OKF bundle tool)

    # The GitHub MCP server Pi runs over stdio (files/home/.pi/agent/mcp.json).
    # Unlike mq and okfctl, the digests are pinned here rather than read from
    # the release's checksums file: the same SHA-256 values sbxagent pins for
    # the v1.12.2 archives, so a re-uploaded asset fails the build too.
    - command: |
        set -eu
        GITHUB_MCP_VERSION=1.12.2

        case "$(uname -m)" in
          x86_64)
            GITHUB_MCP_ASSET=Linux_x86_64
            expected=95843162759da2c31dde082dd145be35db82164594796c294414b69790c2290e
            ;;
          aarch64)
            GITHUB_MCP_ASSET=Linux_arm64
            expected=2b30f9fcc061b57456cbe38ddc0f13c88863bad49557508a9196f2d1c4cb17a5
            ;;
          *)
            echo "github-mcp-server: unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        tmp=$(mktemp -d)
        archive="github-mcp-server_${GITHUB_MCP_ASSET}.tar.gz"
        base="https://github.com/github/github-mcp-server/releases/download/v${GITHUB_MCP_VERSION}"
        curl -fsSL -o "$tmp/$archive" "${base}/${archive}"

        actual=$(sha256sum "$tmp/$archive" | awk '{ print $1 }')
        if [ "$expected" != "$actual" ]; then
          echo "github-mcp-server: checksum mismatch for ${archive}" >&2
          exit 1
        fi

        tar -xzf "$tmp/$archive" -C "$tmp" github-mcp-server
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$tmp/github-mcp-server" "$HOME/.local/bin/github-mcp-server"
        rm -rf "$tmp"
      user: "1000"
      description: Install github-mcp-server (GitHub MCP, stdio)

    # Native Pi package (not MCP): tools + context7-docs skill under ~/.pi/agent/npm/.
    - command: |
        set -eu
        CONTEXT7_PI_VERSION=0.1.3
        pi install "npm:@upstash/context7-pi@${CONTEXT7_PI_VERSION}"
      user: "1000"
      description: Install Context7 Pi extension

    # Static files/home/ copies do not reliably preserve the git 100755 bit;
    # set it explicitly so the compile-okf skill can invoke the wrapper.
    - command: |
        set -eu
        scripts=/home/agent/.pi/agent/skills/compile-okf/scripts
        chmod 0755 "$scripts/check-okf.sh"
      description: Make the compile-okf check script executable

  # Bind mounts do not survive a sandbox stop. The startup hook does not gate
  # the entrypoint or sbx exec; it covers sessions that launch no agent, such
  # as a shell. The entrypoint above (for sbx run) and md2okf-agent.sh (see
  # files below; for every process the driver starts with sbx exec) each bind
  # synchronously and refuse to start the agent if the bind fails. The helper
  # is idempotent.
  startup:
    - command:
        - sh
        - -c
        - |
          set -eu
          HOME="${HOME:-/home/agent}"
          export HOME
          sh "$HOME/.local/lib/md2okf/mount-state.sh" \
            "$HOME/.pi/agent/sessions" sessions
      user: "agent"
      description: Bind-mount Pi sessions onto persistent state

  # Workspace is not mounted during setup.install, so the CLIs are shims that
  # resolve from ${WORKDIR} — the workspace path — rather than from a copy
  # (always tracks the tree). ${WORKDIR} is the wiki, and the projects sit in
  # the scripts/ mount beside it, hence the dirname.
  files:
    # The driver runs every compile turn and `md2okf --agent` through this, so
    # each Pi process first checks the sessions bind itself: `sbx exec`
    # bypasses the entrypoint above. The shared script (identical in every
    # kit) does the work; this shim names Pi's own trace directory and makes
    # the entrypoint's GitHub token exports, which mcp.json expands. They live
    # here rather than in the shared script because only Pi needs them.
    - path: /home/agent/.local/bin/md2okf-agent
      mode: "0755"
      description: Per-process wrapper the driver starts Pi through
      content: |
        #!/bin/sh
        set -eu
        home="${HOME:-/home/agent}"
        if [ -n "${GH_TOKEN:-}" ]; then
          GITHUB_TOKEN="$GH_TOKEN"
          GITHUB_PERSONAL_ACCESS_TOKEN="$GH_TOKEN"
          export GITHUB_TOKEN GITHUB_PERSONAL_ACCESS_TOKEN
        fi
        exec sh "${home}/.local/lib/md2okf/md2okf-agent.sh" \
          "${home}/.pi/agent/sessions" "$@"

    - path: /home/agent/.local/bin/inspectmd
      mode: "0755"
      description: Workspace-backed inspectmd CLI
      content: |
        #!/bin/sh
        set -eu
        exec uv tool run --from "$(dirname "${WORKDIR}")/scripts/inspectmd" inspectmd "$@"

    - path: /home/agent/.local/bin/inspectokf
      mode: "0755"
      description: Workspace-backed inspectokf CLI
      content: |
        #!/bin/sh
        set -eu
        exec uv tool run --from "$(dirname "${WORKDIR}")/scripts/inspectokf" inspectokf "$@"

    - path: /home/agent/.local/bin/sizeokf
      mode: "0755"
      description: Workspace-backed sizeokf CLI
      content: |
        #!/bin/sh
        set -eu
        exec uv tool run --from "$(dirname "${WORKDIR}")/scripts/sizeokf" sizeokf "$@"

    - path: /home/agent/.local/bin/merkleokf
      mode: "0755"
      description: Workspace-backed merkleokf CLI
      content: |
        #!/bin/sh
        set -eu
        exec uv tool run --from "$(dirname "${WORKDIR}")/scripts/merkleokf" merkleokf "$@"
