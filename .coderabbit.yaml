# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for md2okf.
#
# This repo has no application package: its behaviour lives in shell drivers,
# two Docker-based Pi runtimes, hand-maintained config copies, and Markdown.
language: en-US
tone_instructions: "Be concise and focus on critical issues only. Do not comment on trivial matters, nitpicks, or stylistic preferences. Only flag issues that could cause bugs, security vulnerabilities, or significant maintainability problems."
early_access: false
enable_free_tier: true
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: ""
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: ""
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  labeling_instructions: []
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  path_filters:
    - "!uv.lock"
    # md/ and okf/ are gitignored input and generated output. okf/ is excluded
    # by file type rather than wholesale so the one tracked file there,
    # okf/.okflintrc.json, stays reviewable.
    - "!md/**"
    - "!okf/**/*.md"
    - "!pdf2md/**"
    - "!.venv/**"
  path_instructions:
    - path: "**/*.sh"
      instructions: |
        Apply robust Bash practices: use strict error handling where appropriate,
        quote expansions, prefer arrays over constructed command strings, and
        avoid masking failures. Resolve paths independently of the caller's
        working directory, validate prerequisites early, clean up temporary
        resources with traps, keep secrets out of logs and arguments, and
        require ShellCheck-clean code.
    - path: "**/Dockerfile"
      instructions: |
        Apply Dockerfile best practices: pin base images and dependencies, use
        minimal images and multi-stage builds where useful, optimize layers and
        remove package-manager caches, run as a non-root user, copy only needed
        files, and never place secrets in build arguments, environment variables,
        or layers. Keep the image compatible with read-only and least-privilege
        runtime settings, and address Hadolint findings.
    - path: "**/compose.yaml"
      instructions: |
        Apply Compose best practices: use least privilege, non-root users,
        dropped capabilities, no-new-privileges, read-only filesystems and
        mounts where possible, explicit resource limits, and health checks when
        useful. Keep secrets outside the file, fail fast on required variables,
        pin images, and verify relative paths from the compose file's directory.
    - path: "**/spec.yaml"
      instructions: |
        For Docker Sandbox Kit specs, validate against the current schema with
        `sbx kit validate`. Use least-privilege capabilities and default-deny
        network access, document every allowed host, keep credentials
        proxy-managed, and never embed real secrets. Pin installation versions,
        make setup commands idempotent, use non-root users where supported, and
        bound retries and timeouts.
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "DO NOT REVIEW"
      - "WIP"
    labels: []
    drafts: false
    base_branches: []
    ignore_usernames: []
  # No first-party source package and no test suite yet (see the README
  # Development section), so there is nothing for these to generate.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: "Start with an imperative verb, name the area touched, and keep it under 72 characters."
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks: []
  tools:
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    # Shell drivers and the skill's lint wrapper.
    shellcheck:
      enabled: true
    # Dockerfile and Makefile. hadolint picks up .hadolint.yaml (DL3008 ignored)
    # and checkmake matches `make lint` covering the Makefile.
    hadolint:
      enabled: true
    checkmake:
      enabled: true
    # compose.yaml, pi/sandbox/spec.yaml, CI workflows.
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    # Markdown is the main artefact here; CodeRabbit runs markdownlint-cli2 and
    # auto-detects the repo's .markdownlint-cli2.yaml.
    markdownlint:
      enabled: true
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
      level: default
    # Secrets, dependency and IaC scanning — relevant because this repo handles
    # an OpenRouter key and builds a container.
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    semgrep:
      enabled: true
    osvScanner:
      enabled: true
    dotenvLint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 900000
    # No Python source in this repo yet, but pyproject.toml is tracked and
    # `make lint` runs ruff, so keep ruff on the same config and nothing else.
    ruff:
      enabled: true
      config_file: "pyproject.toml"
    pylint:
      enabled: false
    flake8:
      enabled: false
    # Languages this repo does not use.
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false
    htmlhint:
      enabled: false
    swiftlint:
      enabled: false
    phpstan:
      enabled: false
      level: default
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    golangci-lint:
      enabled: false
    detekt:
      enabled: false
    rubocop:
      enabled: false
    brakeman:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    pmd:
      enabled: false
    clang:
      enabled: false
    cppcheck:
      enabled: false
    circleci:
      enabled: false
    clippy:
      enabled: false
    sqlfluff:
      enabled: false
    prismaLint:
      enabled: false
    shopifyThemeCheck:
      enabled: false
    luacheck:
      enabled: false
chat:
  art: false
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: auto
    project_keys: []
  linear:
    usage: auto
    team_keys: []
  pull_requests:
    scope: auto
  mcp:
    usage: auto
    disabled_servers: []
# Inert while finishing_touches above is off; kept so the settings are in place
# when a first-party package and a test suite land.
code_generation:
  docstrings:
    language: en-US
    path_instructions: []
  unit_tests:
    path_instructions: []
issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
