schemaVersion: "2"
kind: sandbox
name: pi-kit
displayName: Pi kit
description: >
  Runs the Pi terminal coding agent in a Docker Sandbox microVM, configured for
  OpenRouter with DeepSeek defaults and proxy-managed API credentials.

sandbox:
  image: "docker/sandbox-templates:shell-docker"
  # Model and provider come from the kit's own config (files/home/.pi/agent/
  # settings.json + models.json), delivered to ~/.pi/agent/ in the VM. No
  # --provider/--model flags here — Pi resolves defaults from settings.json.
  entrypoint: [pi]

# The AI profile Pi reads, and the text appended to it.
agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment
    You are Pi running inside a Docker Sandbox microVM. The user's project is
    mounted as your workspace, and edits apply directly to the host working tree.
    `sudo` is passwordless. If a host is blocked by policy, ask the user to allow
    it with `sbx policy allow network "<host>"`.

# Outbound egress allowlist. Default-deny: every host the kit reaches must be
# listed. Model calls need openrouter.ai, Pi service bootstrap uses pi.dev.
# Pointing Pi at a different provider means adding its host here too — see
# "Using another provider" in the README.
permissions:
  network:
    allow:
      - registry.npmjs.org
      - openrouter.ai
      - pi.dev

# Credentials declare WHAT the kit needs and how the proxy injects it — not
# where it lives on the host (that comes from the user bindings / host env).
# proxyManaged: true sets OPENROUTER_API_KEY inside the container as a
# proxy-managed sentinel (replaces the v1 environment.proxyManaged list).
credentials:
  - service: openrouter
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          header: Authorization
          format: "Bearer %s"

setup:
  install:
    - command: >-
        PI_VERSION=0.82.1;
        npm config set proxy "$HTTP_PROXY";
        npm config set https-proxy "$HTTP_PROXY";
        attempt=1;
        until npm install -g --ignore-scripts --maxsockets=1 --fetch-timeout=600000 "@earendil-works/pi-coding-agent@${PI_VERSION}"; do
        if [ "$attempt" -ge 5 ]; then echo "Pi install failed after ${attempt} attempts" >&2; exit 1; fi;
        echo "Pi install failed (attempt ${attempt}/5), retrying...";
        attempt=$((attempt+1)); sleep 5;
        done
      user: "1000"
      description: "Configure npm proxy and install the Pi coding agent with retries"
    - command: >-
        OKF_LINT_VERSION=0.1.0;
        attempt=1;
        until npm install -g --ignore-scripts --maxsockets=1 --fetch-timeout=600000 "@thisismydesign/okf-lint@${OKF_LINT_VERSION}"; do
        if [ "$attempt" -ge 5 ]; then echo "okf-lint install failed after ${attempt} attempts" >&2; exit 1; fi;
        echo "okf-lint install failed (attempt ${attempt}/5), retrying...";
        attempt=$((attempt+1)); sleep 5;
        done
      user: "1000"
      description: "Install the OKF linter (okf-lint) with retries"
