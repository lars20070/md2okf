[project]
name = "md2okf"
version = "0.1.0"
description = "Convert Markdown files to an OKF knowledge base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["marker-pdf>=1.10.2", "psutil>=7.2.2"]

[dependency-groups]
dev = ["ruff>=0.8"]

# No [build-system] / src layout yet — there is no first-party Python package in
# this repo. Adopt src/md2okf/ + tests/ + pytest when real Python code lands
# (see the README Development section).
[tool.ruff]
target-version = "py312"
