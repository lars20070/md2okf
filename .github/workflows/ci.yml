---
name: CI

on:
  push:
    branches: [master]
  pull_request:

# The jobs only read the checked-out tree.
permissions:
  contents: read

# Cancel superseded runs
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint Markdown, JSON, YAML, shell, spelling, and Python. Reuses `make lint`
  # so the lint definition lives in one place (the Makefile). markdownlint runs
  # via npx; yamllint and ruff run ephemerally at a pinned version via
  # `uv tool run`, belonging to no project, so this job installs neither
  # project's dependencies. cspell and lat run via npx. shellcheck and jq are both
  # pre-installed on ubuntu-latest. The JSON check is syntax only (`jq empty`)
  # — no schema validation.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No git operations after checkout, so don't leave the job token on
          # disk where a later third-party step could read it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Lint (markdownlint, jq, yamllint, shellcheck, cspell, ruff, lat)
        run: make lint MARKDOWNLINT='npx --yes markdownlint-cli2'

  # Unit-test the web2md scraper. Reuses `make test-web2md` so the definition
  # stays in the Makefile. web2md is its own project, so its lockfile holds
  # only the scraper's own deps plus pytest — marker-pdf / torch cannot reach
  # it and there is nothing to exclude. The suite is offline
  # (httpx.MockTransport), so this job needs no network beyond the install.
  test-web2md:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No git operations after checkout, so don't leave the job token on
          # disk where a later third-party step could read it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Test (pytest)
        run: make test-web2md

  # Unit-test the four host CLIs (inspectmd, inspectokf, sizeokf, merkleokf).
  # Reuses `make test-clis`. Each CLI is its own project and lockfile;
  # stdlib-only subjects under test (inspectokf mocks tree). Offline: no
  # network beyond the install.
  test-clis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No git operations after checkout, so don't leave the job token on
          # disk where a later third-party step could read it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Test (pytest)
        run: make test-clis

  # Unit-test the md2okf driver itself. Reuses `make test-md2okf`. Offline:
  # every sbx call goes through the one seam in md2okf.sandbox, which the
  # suite replaces with a fake rather than shelling out to a real sandbox.
  test-md2okf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No git operations after checkout, so don't leave the job token on
          # disk where a later third-party step could read it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Test (pytest)
        run: make test-md2okf

  # Build the distribution and prove it works away from the checkout. Reuses
  # `make dist` so the definition stays in the Makefile. `uv build` builds the
  # wheel from the sdist, so an sdist missing kits/, SPEC.md or
  # scripts/<cli>/ breaks here rather than after a release; the smoke run then
  # exercises the *bundled* assets, which nothing run from the repository can
  # do -- resources.py finds the real tree and every lookup succeeds either
  # way. Offline apart from the installs: --dry-run creates no sandbox.
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No git operations after checkout, so don't leave the job token on
          # disk where a later third-party step could read it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Build and smoke-test the distribution
        run: make dist

  # Build every kit (kits/*/md2okf-*.yaml, schema v3) for both architectures
  # and check each artifact with kit-tck. `sbx kit validate` cannot read a v3
  # source kit, so `make validate` builds with docker buildx instead: the kit
  # frontend validates the descriptor, then kit-tck judges what came out. No
  # daemon-backed sbx and no `sbx login` are needed. arm64 builds under QEMU.
  validate-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No git operations after checkout, so don't leave the job token on
          # disk where a later third-party step could read it.
          persist-credentials: false

      # Install exactly SBX_VERSION, verified by checksum, so the floor
      # validate-spec.sh enforces is the release the kits were written for. The
      # trade-off: newer sbx releases, which Homebrew users run, are not tested
      # here. When SBX_VERSION is raised, update expected_sha256 to the new
      # archive's checksum, and kit-tck below to the spec version it bundles.
      - name: Install sbx CLI
        run: |
          set -euo pipefail
          sbx_version="$(<SBX_VERSION)"
          archive=/tmp/DockerSandboxes-linux.tar.gz
          expected_sha256=eded29017121a857c98d4a91cad593f6a9e00f4010e830679bd385f4a5edba4d
          curl -fsSL \
            "https://github.com/docker/sbx-releases/releases/download/v${sbx_version}/DockerSandboxes-linux.tar.gz" \
            -o "${archive}"
          echo "${expected_sha256}  ${archive}" | sha256sum --check -
          tar xzf "${archive}" -C /tmp
          sudo PREFIX="${HOME}/.docker/sbx" /tmp/docker-sbx/install.sh
          echo "${HOME}/.docker/sbx/bin" >> "$GITHUB_PATH"

      - name: Verify pinned sbx
        run: |
          expected="$(<SBX_VERSION)"
          actual="$(sbx version | grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          test "${actual}" = "${expected}"

      # kit-tck from the spec release sbx 0.54.0 bundles (v3.0.0-m.12),
      # verified by checksum.
      - name: Install kit-tck
        run: |
          set -euo pipefail
          tck_version=3.0.0-m.12
          archive=/tmp/kit-tck.tar.gz
          expected_sha256=473b72d7bb48b11987250493e9b47fb2c616de601777e139191a86fc5e962f21
          base="https://github.com/docker/sandbox-kit-spec/releases/download/v${tck_version}"
          curl -fsSL "${base}/kit-tck_${tck_version}_linux_amd64.tar.gz" -o "${archive}"
          echo "${expected_sha256}  ${archive}" | sha256sum --check -
          mkdir -p "${HOME}/.local/bin"
          tar xzf "${archive}" -C "${HOME}/.local/bin" kit-tck
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      # A docker-container builder: exporting an OCI layout needs one.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and check the kits
        run: make validate
