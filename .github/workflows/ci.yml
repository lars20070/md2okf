name: CI

on:
  push:
    branches: [master]
    # Anchored so the push and pull_request filters can never drift apart.
    paths: &paths
      - "pi/**"
      - "scripts/**"
      - "web2md/**"
      - "Makefile"
      - "AGENTS.md"
      - "README.md"
      - "SPEC.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *paths

# The jobs only read the checked-out tree.
permissions:
  contents: read

# Cancel superseded runs
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint Markdown, shell, JSON, and Python. Reuses `make lint` so the lint
  # definition lives in one place (the Makefile). markdownlint runs via npx (no
  # global install) and ruff runs from the dev group only, so this job never
  # installs the heavy project deps (marker-pdf / torch). shellcheck and jq are
  # both pre-installed on ubuntu-latest. The JSON check is syntax only (`jq
  # empty`) — no schema validation.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No git operations after checkout, so don't leave the job token in
          # .git/config where a later third-party step could read it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Lint (markdownlint, shellcheck, jq, ruff)
        run: make lint MARKDOWNLINT='npx --yes markdownlint-cli2' RUFF='uv run --only-group dev ruff'

  # Unit-test the web2md scraper. Reuses `make test` so the definition stays in
  # the Makefile. `--only-group` twice installs just pytest and the four scraper
  # dependencies from the lockfile: no marker-pdf / torch. The suite is offline
  # (httpx.MockTransport), so this job needs no network beyond the install.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No git operations after checkout, so don't leave the job token in
          # .git/config where a later third-party step could read it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Test (pytest)
        run: make test PYTEST='uv run --only-group test --only-group web2md pytest'

  # Validate pi/spec.yaml against the current Sandbox Kit schema. Static check —
  # no Docker or login; only the CLI download needs the network.
  validate-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No git operations after checkout, so don't leave the job token in
          # .git/config where a later third-party step could read it.
          persist-credentials: false

      # Install the latest sbx CLI. "latest" is intentional: the schema is
      # bundled in the binary, so this surfaces schema drift as soon as it ships.
      # Install steps mirror docker/sbx-kits-contrib .github/workflows/tck.yml.
      - name: Install sbx CLI
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/docker/sbx-releases/releases/latest/download/DockerSandboxes-linux.tar.gz" \
            -o /tmp/DockerSandboxes-linux.tar.gz
          tar xzf /tmp/DockerSandboxes-linux.tar.gz -C /tmp
          sudo PREFIX="${HOME}/.docker/sbx" /tmp/docker-sbx/install.sh
          echo "${HOME}/.docker/sbx/bin" >> "$GITHUB_PATH"

      - name: Verify sbx
        run: sbx version

      - name: Validate Pi kit spec
        run: make validate
