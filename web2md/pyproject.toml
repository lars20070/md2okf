[project]
name = "web2md"
version = "0.1.0"
description = "Scrape a documentation site into a single Markdown file"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.1",
  "markdownify>=1.2.3",
]

# The scraper's runtime deps are plain project dependencies rather than a
# group: nothing heavy lives in this project, so there is nothing to exclude.
[dependency-groups]
test = ["pytest>=8.4"]

# No [build-system]: the module is run by path (`make scrape`), not installed.
# pytest imports it via `pythonpath` below. Both paths are relative to this
# file, so they resolve wherever the project is invoked from.
[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

# These rules are what makes the Python review instructions in .coderabbit.yaml
# enforceable rather than advisory: pycodestyle/pyflakes (E, W, F), import order
# (I), modern syntax (UP), likely bugs including mutable default arguments (B),
# needless complexity (SIM, C4, RET), pytest idioms (PT), and docstrings (D).
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "PT", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation; a docstring on each of them would be noise.
# Fixtures and helpers are still expected to explain themselves.
"tests/*" = ["D100", "D103"]
